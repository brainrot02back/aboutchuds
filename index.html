<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>chuds.gg</title>
<meta name="description" content="chuds.gg - making game cheats and learning since 2022">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<canvas id="graph" aria-hidden="true"></canvas>

<button class="gate" id="gate" type="button" aria-label="Click to enter">
  <span class="gate-panel"><span class="gate-text">click to enter</span></span>
</button>

<button class="sound" id="sound" type="button" aria-label="Mute music" aria-pressed="false">
  <svg class="icon-on" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="icon-off" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg>
</button>

<main class="page">
  <header class="hero">
    <p class="tagline">making game cheats and learning since 2022</p>
  </header>

  <section class="card profile reveal" style="--d:0" aria-label="Discord profile">
    <div class="banner" id="banner"></div>
    <div class="profile-body">
      <div class="avatar-wrap" role="img" aria-label="Discord profile picture">
        <img class="avatar" id="avatar" alt="" width="92" height="92">
        <span class="status" id="status" data-state="offline"></span>
      </div>
      <div class="identity">
        <p class="display" id="display">chuds.gg</p>
        <p class="handle" id="handle"></p>
        <p class="custom" id="custom" hidden></p>
      </div>
    </div>
    <div class="activity" id="activity">
      <p class="idle">connecting to discord...</p>
    </div>
  </section>

  <section class="block reveal" style="--d:1" aria-labelledby="langs-title">
    <h2 id="langs-title">Languages</h2>
    <ul class="tiles three">
      <li class="tile"><img src="assets/cpp.svg" alt="" width="48" height="48"><span>C++</span></li>
      <li class="tile"><img src="assets/csharp.svg" alt="" width="48" height="48"><span>C#</span></li>
      <li class="tile"><img src="assets/python.svg" alt="" width="48" height="48"><span>Python</span></li>
    </ul>
  </section>

  <section class="block reveal" style="--d:2" aria-labelledby="tools-title">
    <h2 id="tools-title">Tools</h2>
    <ul class="tiles four">
      <li class="tile"><img class="lift" src="assets/cheatengine.png" alt="" width="48" height="48"><span>Cheat Engine</span></li>
      <li class="tile"><img src="assets/ida.svg" alt="" width="48" height="48"><span>IDA</span></li>
      <li class="tile"><img src="assets/ghidra.png" alt="" width="48" height="48"><span>Ghidra</span></li>
      <li class="tile"><img src="assets/wireshark.svg" alt="" width="48" height="48"><span>Wireshark</span></li>
    </ul>
  </section>
</main>

<audio id="music" src="assets/music.mp3" loop preload="auto"></audio>
<script src="script.js"></script>
</body>
</html>
